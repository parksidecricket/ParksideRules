<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkside Cricket League · Rule Finder</title>
<style>
:root{
  --pitch:#24452A; --pitch-deep:#17301C; --willow:#E7DCC2; --willow-soft:#F3EEE1;
  --seam:#A3242B; --ink:#1D241E; --muted:#5D6B5F; --page:#FAFAF6; --surface:#FFFFFF;
  --line:#D9DED5; --user-bubble:#24452A; --user-ink:#FFFFFF; --tag-bg:#EDE3CB; --tag-ink:#4A3A12;
  --hl:#FFF3C4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pitch:#7FB487; --pitch-deep:#0F1B11; --willow:#2B2A22; --willow-soft:#1E2119;
    --seam:#E06A6F; --ink:#E9EDE6; --muted:#A3AEA4; --page:#121611; --surface:#1A1F19;
    --line:#2E362D; --user-bubble:#2F5A36; --user-ink:#F2F7F0; --tag-bg:#3A3320; --tag-ink:#F0DFAE;
    --hl:#4A4220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --pitch:#7FB487; --pitch-deep:#0F1B11; --willow:#2B2A22; --willow-soft:#1E2119;
  --seam:#E06A6F; --ink:#E9EDE6; --muted:#A3AEA4; --page:#121611; --surface:#1A1F19;
  --line:#2E362D; --user-bubble:#2F5A36; --user-ink:#F2F7F0; --tag-bg:#3A3320; --tag-ink:#F0DFAE;
  --hl:#4A4220;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* Header: the scoreboard */
header{background:#17301C;color:#F3EEE1;padding:14px 18px 0;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:38px;height:38px;border:2px solid #F3EEE1;display:grid;place-items:center;flex:none}
.mono svg{width:24px;height:24px}
.brand h1{margin:0;font:700 26px/1 "Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:13px;color:#C9D4C6}
.seam{height:6px;margin-top:14px;background:
  repeating-linear-gradient(90deg,#F3EEE1 0 6px,transparent 6px 12px) center/100% 2px no-repeat,
  #A3242B}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{flex:1;border:0;background:transparent;color:#C9D4C6;padding:10px 0 12px;cursor:pointer;
  font:600 17px/1 "Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:#FFFFFF;border-bottom-color:#E7DCC2}
.tab:focus-visible{outline:2px solid #E7DCC2;outline-offset:-2px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* Chat */
.log{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}
.welcome h2{font:700 24px/1.15 "Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;margin:4px 0 6px}
.welcome p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;
  cursor:pointer;font-size:15px;text-align:left}
.chip:hover{border-color:var(--pitch)}
.chip:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user-bubble);color:var(--user-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin-bottom:0}
.msg.bot ul{margin:4px 0 8px;padding-left:20px}.msg.bot li{margin:2px 0}
.msg.thinking{color:var(--muted);font-style:italic}
.msg.err{border-color:var(--seam);color:var(--ink)}
.ref{display:inline-block;background:var(--tag-bg);color:var(--tag-ink);border:0;border-radius:4px;
  padding:0 6px;margin:0 1px;font:600 13px/1.6 system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.ref:focus-visible{outline:2px solid var(--pitch)}
.composer{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--page)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:var(--surface);color:var(--ink);font:inherit;max-height:120px;min-height:44px}
.composer textarea:focus{outline:2px solid var(--pitch);outline-offset:0;border-color:transparent}
.send{border:0;background:var(--seam);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;min-width:72px}
.send:disabled{opacity:.5;cursor:default}
.send:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.notice{margin:0 16px 12px;padding:10px 12px;border-left:3px solid var(--seam);background:var(--willow-soft);font-size:14px}

/* Browse */
.searchbar{padding:12px 16px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.searchbar input:focus{outline:2px solid var(--pitch);border-color:transparent}
.book{flex:1;overflow-y:auto;padding:4px 16px 24px}
.group-title{font:700 20px/1.2 "Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;color:var(--pitch);margin:22px 0 4px;
  padding-bottom:4px;border-bottom:2px solid var(--willow)}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
summary:focus-visible{outline:2px solid var(--pitch)}
.override{font-size:14px;color:var(--muted);font-style:italic;margin:-4px 0 8px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 6px;border-radius:6px;transition:background .6s}
.rule .n{font:600 14px/1.5 system-ui,sans-serif;color:var(--tag-ink);background:var(--tag-bg);border-radius:4px;padding:0 6px;height:fit-content;white-space:nowrap}
.rule .t{white-space:pre-line}
.rule.flash{background:var(--hl)}
.empty{color:var(--muted);padding:24px 0}
.foot{font-size:13px;color:var(--muted);padding:16px 0 0}
@media (prefers-reduced-motion: reduce){.rule{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F3EEE1" stroke-width="2"><path d="M12 4v14"/><path d="M12 6.5c-4 0-6 1.3-6 3.5s2 3.5 6 3.5"/><path d="M12 6.5c4 0 6 1.3 6 3.5s-2 3.5-6 3.5"/><path d="M3 21c3-2.2 6-3 9-3s6 .8 9 3"/></svg>
      </div>
      <div>
        <h1>Parkside Cricket League</h1>
        <p>Rule finder · Handbook v2.3 · works offline</p>
      </div>
    </div>
    <div class="seam" aria-hidden="true"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-ask" aria-selected="true" aria-controls="view-ask">Ask a question</button>
      <button class="tab" role="tab" id="tab-browse" aria-selected="false" aria-controls="view-browse">Browse the rules</button>
    </div>
  </header>

  <main>
    <section class="view on" id="view-ask" role="tabpanel" aria-labelledby="tab-ask">
      <div class="log" id="log" aria-live="polite">
        <div class="welcome" id="welcome">
          <h2>What's the ruling?</h2>
          <p>Type a question or a few keywords. You'll get the matching rules from the handbook, word for word. Everything runs on your phone, with no internet needed.</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="notice" id="notice" hidden></div>
      <div class="composer">
        <textarea id="q" rows="1" placeholder="e.g. second power play, toss, wide" aria-label="Your question"></textarea>
        <button class="send" id="send">Find</button>
      </div>
    </section>

    <section class="view" id="view-browse" role="tabpanel" aria-labelledby="tab-browse">
      <div class="searchbar"><input id="search" type="search" placeholder="Search rules: wide, toss, power play…" aria-label="Search rules"></div>
      <div class="book" id="book"></div>
    </section>
  </main>
</div>

<script>
/* ---------- Rule book data (Handbook v2.3) ---------- */
const BOOK = [
 {group:"General info", sections:[
  {ref:"General 1", title:"Version control", rules:[
   "V1.0 (04.28.2025) Original version of PXVL rules.","V1.1 (09.13.2025) Rule updates for Fall League 2025.",
   "V1.2 (09.16.2025) Updated semifinal qualification criteria and Impact Player bowling rule.","V1.3 (10.15.2025) Changes based on captains review.",
   "V1.4 (01.18.2026) Updated roles and responsibilities for PCC & PCV.","V2.0 (05.29.2026) Rules cleanup, restructuring & PCPL rule updates.",
   "V2.1 (05.29.2026) Additional rule refinements.","V2.2 (09.01.2026) Additional rule refinement; adding player limit rules for standard team tournament.",
   "V2.3 (09.11.2026) Added Second Power Play section for Fall Tournament."]},
  {ref:"General 2", title:"Parkside committees", rules:[

   "PCV (Parkside Cricket Volunteers): Revanth (Dallas Rockets), Mohit (Mavericks), Abdul (Juggernauts), Vikas Sharma (Denali), Saurav (PSK), Kiran (Bahubalis), Nitin (Ivy Hill Warriors), Kishore (Sunrisers), Anand (Titans)."]},
  {ref:"General 3", title:"General tournament specifications", rules:[
   "Ground: Commons at Parkside.","CricClubs app name: Parkside T12 Cricket League.",
   "Number of overs, number of participating teams and powerplay overs: see the tournament-specific match format section.",
   "League link (PXVL): https://cricclubs.com/ParksideT12CricketLeague/","League link (PCPL): https://cricclubs.com/ParksideCricketPremierLeague/",
   "Pitch distance: 66 feet / 20.12 m (wicket to wicket).",
   "The ICC T20 rule document is used for reference; Parkside tournament rules override ICC rules where applicable."]},
  {ref:"General 4", title:"General tournament format", rules:[
   "Spring season: Standard teams, round robin, red ball, Feb end – May mid.",
   "Summer season (PCPL): Mixed teams (auction), round robin, red ball, May end – Aug end.",
   "Fall season: Standard teams, round robin, green ball, Sep – Dec."]}
 ]},
 {group:"Match & playing rules", sections:[
  {ref:"Timing 1", title:"1. Match timing & attendance", rules:[
   "If a match is scheduled to begin at 8:00 AM but fewer than 8 players are present for either the batting or bowling side, a grace period is allowed until 8:15 AM with no penalty.",
   "If by 8:15 AM only one team still does not have at least 8 players, the team with fewer players will forfeit, and points will be awarded to the opponent as winners. The minimum number of players required to start a match is 8 per side.",
   "If both teams fail to have a minimum of 8 players within 15 minutes of the scheduled start time (i.e., by 8:15 AM) without prior notification to the umpires, the match shall be cancelled and points shared equally. No reschedule is permitted.",
   "If by 8:15 AM any assigned umpire is not available on the ground, 1 point shall be deducted from the team to which the umpire belongs.",
   "Strategic Time-Out: A mandatory break of 15 minutes shall be taken after the completion of the 8th over in each innings. Either captain or the on-field umpires may call for this break. Play must resume promptly once the 15 minutes have elapsed.",
   "Summer Heat Break: During summer season matches, based on either captain's request, if the on-field umpires determine that weather conditions pose a heat-related risk to players, they may grant two (2) hydration breaks per innings, one after the 5th over and another after the 10th over, each lasting a maximum of 5 minutes. The decision to invoke heat breaks rests solely with the umpires and is not subject to appeal by either team. When heat breaks are in effect, the standard 8th-over strategic time-out shall not apply."]},
  {ref:"Toss 2", title:"2. Toss rules", rules:[
   "The toss shall be conducted by the on-field umpires in the presence of both captains or vice-captain before the scheduled start of the match.",
   "The captain winning the toss must immediately announce within 5 mins of the toss whether the team will bat or field first, otherwise the toss is awarded to the other team.",
   "If only one team does not have the minimum 8 players by the scheduled start time (8:00 AM), the toss is automatically awarded to the team that has the required players present (see Rule 1.2).",
   "The toss decision, once announced, is final and cannot be changed."]},
  {ref:"Reschedule 3A", title:"3A. Rescheduling – general principles", rules:[
   "No match shall be rescheduled under any circumstances unless explicitly approved by the PCV.",
   "Any decision related to match delay, abandonment, forfeiture, rescheduling, or continuation due to weather or ground conditions shall be made jointly by the assigned Umpires and the PCV through a phone or video call. At least two (2) PCV members must participate in the decision-making process.",
   "If a consensus cannot be reached, or if sufficient PCV members are unavailable, the PCC shall make the final decision.",
   "Captains, teams or Umpires individually do not have the authority to independently abandon, postpone, or reschedule a match."]},
  {ref:"Reschedule 3B", title:"3B. Pre-match ground assessment", rules:[
   "Umpires must be present at the ground at least thirty (30) minutes prior to the scheduled start time.",
   "Umpires shall assess the safety and playability of the pitch and outfield, including but not limited to: wet pitch conditions, slippery playing surfaces, standing water or puddles, and any condition that may pose a safety risk to players.",
   "If ground conditions are unclear or disputed, the Umpires must provide photographic or video evidence to the PCV before any decision is made."]},
  {ref:"Reschedule 3C", title:"3C. Before the match has started", rules:[
   "A match may not be abandoned or rescheduled solely at the discretion of the Umpires. The Umpires must consult the PCV before any final decision is made.",
   "In cases where the actual temperature at the scheduled start time is below 50°F or above 105°F (as reported by AccuWeather), and the forecast does not indicate improving conditions, or bad weather/ground conditions, the Umpires and PCV shall jointly determine whether the match can proceed, be delayed, or rescheduled. Note: The reschedule policy for each season may vary and will be communicated separately by PCV.",
   "If the Umpires and PCV determine that the ground and weather conditions are playable, the match must proceed.",
   "If one team refuses to play after the Umpires and PCV have declared the match playable, that team shall forfeit the match and the opposing team shall receive full points.",
   "If both teams refuse to play after the Umpires and PCV have declared the match playable, no points shall be awarded to either team.",
   "Captains may not mutually agree to abandon or reschedule a match. Only the Umpires and PCV have the authority to make such a decision.",
   "If conditions may improve, the Umpires and PCV may delay the match rather than abandon it, provided: (a) it is on the same day, (b) it does not interfere with other scheduled matches, and (c) both captains agree on the revised start time before leaving the venue.",
   "If captains are unable to agree on a revised day / time by EOD (match day), the match shall be abandoned and points shared equally. Any agreement on revised start time should be clearly communicated to PCV.",
   "If the match cannot start due to weather/ground conditions after an approved delay, the match shall be abandoned and points shared equally. If the match cannot start due to a team's unavailability, limited players, or refusal to play on the revised day / time, that team shall forfeit.",
   "Conditions for rescheduling of a match:\n• Match is overlapping with an HOA event – PCV will confirm this conflict with HOA representatives and determine that match is not playable; both team captains should agree on a revised day / time by EOD (match day). Revised day / time for the match must be before the EOD Sunday of the following weekend and not disrupt any of the existing scheduled matches. If the match is determined to be a wash out after the initial reschedule, then the match will be abandoned and points shared equally.\n• Match is washed out (before match has started) – Umpires and PCV will jointly determine that match is a washout and match is not playable; both team captains should agree on a revised day / time by EOD (match day). Revised day / time for the match must be before the EOD Sunday of the following weekend and not disrupt any of the existing scheduled matches. If the match is determined to be a wash out after the initial reschedule, then the match will be abandoned and points shared equally.\n• Match is washed out (after match has started but before DLS minimum) – Umpires and PCV will jointly determine that match is a washout and match is not playable (after the allowable delay listed in section 3D, bullet 2); in this instance, the match will be abandoned and points shared equally."]},
  {ref:"Reschedule 3D", title:"3D. Once the match has started", rules:[
   "Once a match has started (first ball is bowled), it may not be rescheduled or resumed on another day under any circumstances.",
   "Short weather-related interruptions of approximately fifteen (15) to thirty (30) minutes may be permitted at the discretion of the Umpires, provided such delay does not adversely impact subsequent scheduled matches.",

   "Teams or captains may not refuse continuation of play or force abandonment once the match has commenced."]},
  {ref:"Reschedule 3E", title:"3E. Result after interruption", rules:[

   "If the minimum required overs of the second innings have not been completed and the match cannot continue, the match shall be declared abandoned and points shared equally, regardless of the preference or agreement of the captains."]},
  {ref:"Reschedule 3F", title:"3F. Playoffs", rules:[
   "Any rescheduling, abandonment, replay, or special consideration involving Semi-Final or Final matches shall be determined solely by the PCV.",
   "The PCV reserves the right to establish separate scheduling and weather-related procedures for playoff matches when required."]},
  {ref:"Batting 4", title:"4. Batting rules", rules:[
   "A batsman who retires due to illness or injury (retired hurt) can resume his innings after the fall of a wicket.",
   "A batsman who retires for any reason other than illness or injury (retired out) can resume his innings only if the opponent captain agrees to it.",
   "No bi-runners (runner for an injured batsman) are allowed in the tournament.",
   "Any batsman who hits the ball directly (with no contact with the metal fence) into the perimeter of any home near the commons park pitch shall receive no runs for that delivery. The individual batsman is personally responsible for any damages to nearby houses or individuals walking around the park. No captain, vice-captain, or organizing group member shall be held liable.",
   "Leg byes are not accounted for, and hence the batsmen cannot be declared out for attempting to score a run during a leg bye.",
   "Stumping after the ball hits the leg or body of the batsman is not considered out.",
   "If the ball hits the batsman's body, it will normally be treated as a dead ball. However, if the ball subsequently goes to hit the stumps after hitting the batsman's body, the batsman will be out.",
   "Byes and overthrows are accounted for.",
   "If a batsman is on the non-striker's end and is found backing up too far before the bowler releases the ball, the bowler may run out the non-striker (Mankad). The bowler must attempt the run-out before the ball is delivered. No warning is required.",
   "An innings is complete when all allotted overs are bowled, or when 10 wickets fall, whichever occurs first."]},
  {ref:"Bowling 5", title:"5. Bowling rules", rules:[
   "No bowler shall bowl more than 3 overs in an innings.",
   "Any No-ball constitutes a free hit for the following delivery.",
   "A ball shall be declared a No-ball if: (a) the bowler oversteps the bowling crease, (b) the bowler hits the bowling stumps before delivery, (c) a full toss is above the waist of the batsman in normal stance, (d) the third bouncer or more occurs in an over above the shoulder, (e) fielding restrictions are not followed, or (f) the ball pitches off the pitch.",
   "If a bowler delivers more than two balls in an over where the ball bounces and is above the shoulder of the batsman, the umpire shall call and signal No-ball on each subsequent occasion.",
   "If a delivery is over the head of the batsman after one bounce and the batsman has not contacted the ball, the umpire shall signal it as a WIDE. This also constitutes one warning for the over for short-pitched bowling.",
   "If the batsman makes contact with a ball that is over his head and it is the first ball above the shoulder in that over, the ball will be deemed legal, and it shall constitute a first warning for the over.",
   "Any full toss above the waist of the batsman in his normal stance is considered a Beamer. For the first instance, it is declared a No-ball with a free hit.",
   "If a bowler bowls a third beamer in a match, the bowler is immediately barred from bowling further in that match.",
   "The ICC rule for the wide ball is adopted in this tournament. On normal stance (on middle stump), it is declared wide if the ball is outside the wide line. If the batsman moves towards his offside before the ball is delivered, the pre-marked wide line is immaterial and the wide is judged based on the batsman's new position. In case of a switch hit or reverse sweep (after ball is delivered), both sides of the batsman are considered offside for judging the wide.",
   "The wide line shall be measured at 1 bat-width from the middle stump. With the batsman on normal stance (middle stump), any ball that passes outside the marked Wide Line shall be called Wide. If the batsman changes stance before the ball is delivered, the wide line would shift accordingly and based on the umpire's judgement, if the ball is not within reach of the batsman, that ball would be considered a Wide.",

   "If a bowler's action is suspected to be chucking, the batsman must walk off without attempting to play the delivery, and the delivery will be declared a dead ball. The bowler will be monitored by the umpires and batsmen for further deliveries. Any instance of chucking after the warning will result in the bowler losing eligibility to bowl again in that innings.",
   "A leg-side wide takes precedence over a waist-height no-ball. If the delivery meets the criteria for both, it will be called a wide."]},
  {ref:"Fielding 6", title:"6. Fielding rules", rules:[
   "During Powerplay, the fielding team is allowed only have 2 fielders outside the inner circle.",
   "After the Powerplay, teams can have up to 5 boundary fielders.",
   "If a team has only 8, 9, or 10 players instead of 11, they can still have up to 5 boundary fielders.",

   "Fielders (other than the wicketkeeper) cannot wear any kind of gloves during fielding. Tapes or bandages are allowed.",
   "The inner circle boundary for the Powerplay must be clearly marked before the start of the match using cones or markers. If the inner circle is not marked, the umpires shall determine the imaginary 30-yard circle and their judgment on fielding positions shall be final.",

  {ref:"Impact 7", title:"7. Impact Player (substitute) rules", rules:[

   "The substitution may be made during any natural break of the match: start of an innings, end of an over, fall of a wicket, or when a batsman retires.",

   "An Impact Player is eligible to bowl immediately upon entering the field, with no cooling-off period required.",

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const refId = r => "r-" + r.toLowerCase().replace(/[^a-z0-9]+/g,"-");

function currentSeason(d = new Date()){
  const m = d.getMonth(); // 0-based
  if (m >= 8) return "Fall (PCPL 2026 Fall match format applies)";
  if (m >= 5 || (m === 4 && d.getDate() > 20)) return "Summer (PCPL 2026 Summer match format applies)";
  return "Spring";
}

function bookText(){
  let out = "";
  for (const g of BOOK){
    out += `\n## ${g.group}\n`;
    for (const s of g.sections){
      out += `\n### ${s.title} [section ${s.ref}]\n`;
      if (s.note) out += `(${s.note})\n`;
      s.rules.forEach((r,i) => { out += `[${s.ref}.${i+1}] ${r}\n`; });
    }
  }
  return out;
}

/* light markdown: escape, then bold, bullets, paragraphs, ref tags */
function render(md){
  const lines = esc(md.trim()).split("\n");
  let html = "", inList = false, para = [];
  const flush = () => { if (para.length){ html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  for (const raw of lines){
    const line = raw.trimEnd();
    const li = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (li){ flush(); if (!inList){ html += "<ul>"; inList = true; } html += "<li>" + li[1] + "</li>"; continue; }
    if (inList){ html += "</ul>"; inList = false; }
    if (!line.trim()){ flush(); continue; }
    para.push(line);
  }
  flush(); if (inList) html += "</ul>";
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\[([A-Za-z]+ (?:S?\d+[A-F]?)\.\d+)\]/g, (m, r) =>
    `<button class="ref" data-ref="${r}" title="Open rule ${r}">${r}</button>`);
  return html;
}

/* ---------- Browse ---------- */
function buildBook(filter = ""){
  const q = filter.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  const book = $("#book"); book.innerHTML = "";
  let hits = 0;
  for (const g of BOOK){
    const frag = document.createDocumentFragment();
    let groupHits = 0;
    for (const s of g.sections){
      const matches = s.rules.map((r,i) => ({r, i}))
        .filter(({r}) => !terms.length || terms.every(t => (s.title + " " + r).toLowerCase().includes(t)));
      if (!matches.length) continue;
      groupHits += matches.length;
      const d = document.createElement("details");
      if (terms.length) d.open = true;
      d.dataset.section = s.ref;
      d.innerHTML = `<summary>${esc(s.title)}</summary>` + (s.note ? `<p class="override">${esc(s.note)}</p>` : "") +
        matches.map(({r,i}) => `<div class="rule" id="${refId(s.ref + "." + (i+1))}"><span class="n">${esc(s.ref)}.${i+1}</span><span class="t">${esc(r)}</span></div>`).join("");
      frag.appendChild(d);
    }
    if (groupHits){
      const h = document.createElement("h3"); h.className = "group-title"; h.textContent = g.group;
      book.appendChild(h); book.appendChild(frag); hits += groupHits;
    }
  }
  if (!hits) book.innerHTML = `<p class="empty">No rules match “${esc(filter)}”. Try a shorter word, or ask the question in the Ask tab.</p>`;
  else book.insertAdjacentHTML("beforeend", `<p class="foot">Parkside Cricket League Rule Handbook v2.3. The PCV is the first point of contact for anything unclear.</p>`);
}

function openRule(ref){
  $("#search").value = ""; buildBook();
  showTab("browse");
  const el = document.getElementById(refId(ref));
  if (!el) return;
  el.closest("details").open = true;
  el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800);
}

/* ---------- Tabs ---------- */
function showTab(which){
  const ask = which === "ask";
  $("#tab-ask").setAttribute("aria-selected", ask); $("#tab-browse").setAttribute("aria-selected", !ask);
  $("#view-ask").classList.toggle("on", ask); $("#view-browse").classList.toggle("on", !ask);
}
$("#tab-ask").onclick = () => showTab("ask");
$("#tab-browse").onclick = () => showTab("browse");
$("#search").addEventListener("input", e => buildBook(e.target.value));
document.addEventListener("click", e => {
  const b = e.target.closest(".ref"); if (b) openRule(b.dataset.ref);
});

const stem = w => w.length > 4 ? w.replace(/(ing|ers|ed|es|s)$/,"").replace(/e$/,"") : w.replace(/s$/,"");
function norm(t){ t = t.toLowerCase(); for (const [re, rep] of PHRASES) t = t.replace(re, " " + rep + " "); return t; }
function toks(t){ return (norm(t).match(/[a-z0-9:]+/g) || []).filter(w => !STOP.has(w)).map(stem); }

const DOCS = [];
for (const g of BOOK) for (const s of g.sections) s.rules.forEach((r,i) => {
  const season = s.ref.startsWith("Fall") ? "fall" : s.ref.startsWith("Summer") ? "summer" : "general";
  DOCS.push({ref: s.ref + "." + (i+1), title: s.title, group: g.group, text: r, season,
    body: new Set(toks(r + " " + (s.note || ""))), head: new Set(toks(s.title + " " + g.group))});
});
const DF = {};
for (const d of DOCS) for (const t of new Set([...d.body, ...d.head])) DF[t] = (DF[t] || 0) + 1;
const idf = t => Math.log(1 + DOCS.length / (1 + (DF[t] || 0)));

const SEASON = (() => { const m = new Date().getMonth(); return m >= 8 ? "fall" : (m >= 5 ? "summer" : "spring"); })();
const OVERRIDES = {"Bowling 5.1":["Fall S2","Summer S2"], "Reschedule 3C.2":["Fall S5","Summer S4"]};

function search(question){
  const qt = [...new Set(toks(question))];
  if (!qt.length) return [];
  const wantSummer = /summer/i.test(question), wantFall = /\bfall\b/i.test(question), wantGeneral = /spring|general|standard/i.test(question);
  return DOCS.map(d => {
    let score = 0, hit = 0;
    for (const t of qt){
      const w = idf(t);
      if (d.body.has(t)) { score += w; hit++; }
      else if (d.head.has(t)) { score += w * 0.7; hit++; }
    }
    if (!hit) return null;
    score *= (0.4 + hit / qt.length) * 3 / Math.pow(d.body.size + 4, 0.3);
    const target = wantSummer ? "summer" : wantFall ? "fall" : wantGeneral ? "general" : SEASON;
    if (d.ref.startsWith("General 1.")) score *= 0.3;
    if (d.season !== "general") score *= (d.season === target ? 1.35 : 0.55);
    return {d, score};
  }).filter(Boolean).sort((a,b) => b.score - a.score);
}

function ruleCard(d){
  let html = `<p><button class="ref" data-ref="${esc(d.ref)}">${esc(d.ref)}</button> <strong>${esc(d.title.replace(/^[\dA-Z]+\.\s*/,""))}</strong></p>`;
  html += esc(d.text).split("\n").map(l => `<p>${l}</p>`).join("");
  const ov = OVERRIDES[d.ref];
  if (ov) html += `<p><em>Season formats change this rule: see </em>${ov.map(r => `<button class="ref" data-ref="${r}.1">${r}</button>`).join(" ")}</p>`;
  return html;
}

function addMsg(cls, html){
  const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

function ask(text){
  if (!text.trim()) return;
  $("#welcome")?.remove();
  addMsg("user", esc(text));
  q.value = ""; autosize();
  const res = search(text);
  if (!res.length || res[0].score < 1.2){
    addMsg("bot", "<p>I couldn't find a rule that matches that. Try different words (for example “wide”, “toss”, “forfeit”), search in <strong>Browse the rules</strong>, or check with your team's PCV member.</p>");
    return;
  }
  const top = res[0].score;
  const extra = res.slice(1).filter(r => r.score >= top * 0.6).slice(0, 2);
  let html = "<p>Closest match in the rule book:</p>" + ruleCard(res[0].d);
  if (extra.length) html += `<p style="margin-top:12px"><em>Also related:</em></p>` + extra.map(r => ruleCard(r.d)).join("");
  addMsg("bot", html);
}

function autosize(){ q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 120) + "px"; }
q.addEventListener("input", autosize);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(q.value); } });
send.onclick = () => ask(q.value);

const chips = $("#chips");
SUGGESTIONS.forEach(s => {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = s;
  b.onclick = () => ask(s); chips.appendChild(b);
});

buildBook();
</script>
